name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Unit tests
        run: npm test
      - name: Check the passing example (should exit 0)
        run: node bin/xaf.mjs check examples/sample.md
      - name: Check a bad article (should exit 1)
        run: |
          if node bin/xaf.mjs check tests/fixtures/bad.md; then
            echo "expected failure but got success"; exit 1
          else
            echo "correctly rejected"
          fi
